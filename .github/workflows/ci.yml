name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Compile Python
        run: python -m compileall -q strtg_asist tests story_asistani.py

      - name: Unit tests
        run: pytest

      - name: Fatal lint checks
        run: ruff check strtg_asist tests story_asistani.py

      - name: Verify Telegram runtime has no extra dependency
        # Üretim workflow'u yalnızca Pillow kurar; worker'ın stdlib dışına
        # çıkmadığını burada erkenden yakalayalım.
        run: |
          python -m venv /tmp/prodenv
          /tmp/prodenv/bin/pip install --disable-pip-version-check -q -r requirements-telegram.txt
          /tmp/prodenv/bin/python -c "import strtg_asist.telegram_worker; print('telegram worker imports OK')"

      - name: Validate workflow YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in sorted(Path('.github/workflows').glob('*.yml')):
              yaml.safe_load(path.read_text(encoding='utf-8'))
              print('OK', path)
          PY

      - name: Validate Cloudflare Worker syntax
        run: node --check cloudflare/telegram-webhook.js

      - name: Validate Cloudflare Worker deploy config
        # Cloudflare Workers Builds kök dizinde `wrangler deploy` çalıştırır.
        # Kökte wrangler.toml yoksa ya da `main` var olmayan bir dosyayı
        # gösteriyorsa otomatik dağıtım kırılır; PR'da yakalayalım.
        run: npx --yes wrangler@4 deploy --dry-run --outdir "$RUNNER_TEMP/worker-build"

      - name: Verify Worker and workflow inputs match
        # Worker'ın gönderdiği workflow_dispatch input adları ile workflow'un
        # beklediği adlar ayrışırsa GitHub dispatch'i 422 ile reddeder.
        run: |
          python - <<'PY'
          import re, sys
          from pathlib import Path
          import yaml

          workflow = yaml.safe_load(
              Path('.github/workflows/telegram-story.yml').read_text(encoding='utf-8')
          )
          declared = set(workflow[True]['workflow_dispatch']['inputs'])
          js = Path('cloudflare/telegram-webhook.js').read_text(encoding='utf-8')
          sent = set(re.findall(r'\b(telegram_[a-z_]+):', js))

          if sent - declared:
              sys.exit(f'Worker bilinmeyen input gonderiyor: {sorted(sent - declared)}')
          missing = {
              name for name, spec in workflow[True]['workflow_dispatch']['inputs'].items()
              if spec.get('required') and name not in sent
          }
          if missing:
              sys.exit(f'Worker zorunlu input gondermiyor: {sorted(missing)}')
          print('workflow_dispatch inputs OK:', sorted(sent))
          PY
