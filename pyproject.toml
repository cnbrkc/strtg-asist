# Tek yapılandırma dosyası: pytest + ruff.
# (Eski pytest.ini buraya taşındı.)

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# CI'da üretimi kıracak sınıflar zorunlu (F: hatalar, E9: sözdizimi, I: import düzeni).
select = ["F", "E9", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
